services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: assid
      POSTGRES_USER: assid
      POSTGRES_PASSWORD: assid
    ports:
      - '5434:5432'
    volumes:
      - assid_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - assid_redis_data:/data

volumes:
  assid_postgres_data:
  assid_redis_data:
